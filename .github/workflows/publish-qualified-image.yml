# Exact qualified image only. First publication requires protected owner risk approval.
name: Publish exact qualified Zevyrn 1.2.1 image
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect archive first; publication/public verification require separate authority
        type: choice
        options: [inspect, authorize, publish, publish-first, verify-public]
        default: inspect
        required: true
      draft_asset_id:
        description: Numeric asset ID of qualified-runtime-v1.2.1.oci.tar in the draft release
        type: string
        required: false
permissions: {}
concurrency:
  group: zevyrn-qualified-ghcr-1.2.1
  cancel-in-progress: false
env:
  DRAFT_LOOKUP_JS: |
    'use strict';
    const fs = require('node:fs');
    function reject() { throw new Error('DRAFT_RELEASE_IDENTITY_REJECTED'); }
    const repository = 'TheStateOfWhere/zevyrn-password-generator';
    if (process.env.REPOSITORY !== repository || !/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '')) reject();
    const pages = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/releases.json', 'utf8'));
    if (!Array.isArray(pages) || pages.length === 0 || !pages.every(Array.isArray)) reject();
    const releases = pages.flat();
    if (!releases.every(r => r && typeof r === 'object' && typeof r.tag_name === 'string')) reject();
    // Count every matching tag, including published or contradictory records.
    const matches = releases.filter(r => r.tag_name === 'v1.2.1');
    if (matches.length !== 1) reject();
    const release = matches[0];
    if (!Number.isSafeInteger(release.id) || release.id <= 0 || release.draft !== true ||
        release.target_commitish !== process.env.GITHUB_SHA ||
        release.url !== 'https://api.github.com/repos/' + repository + '/releases/' + release.id ||
        release.assets_url !== release.url + '/assets') reject();
    fs.writeFileSync(process.env.RUNNER_TEMP + '/draft.json', JSON.stringify(release));
  REGISTRY_CHECK_JS: |
    'use strict';
    // Embedded verbatim in the one proposed workflow; no external code is fetched.
    const fs = require('node:fs');
    const crypto = require('node:crypto');
    const TARGET = 'https://ghcr.io/v2/thestateofwhere/zevyrn/manifests/1.2.1';
    const SCOPE = 'repository:thestateofwhere/zevyrn:pull';
    const TOKEN_URL = 'https://ghcr.io/token?service=ghcr.io&scope=' + encodeURIComponent(SCOPE);
    // Standard GitHub protection/approval evidence; never a substitute for environment enforcement.
    const ENVIRONMENT = 'zevyrn-ghcr-publication';
    const API = 'https://api.github.com/repos/TheStateOfWhere/zevyrn-password-generator';
    const ENV_URL = API + '/environments/' + ENVIRONMENT;
    const POLICIES_URL = ENV_URL + '/deployment-branch-policies?per_page=100';
    const APPROVALS_URL = API + '/actions/runs/' + process.env.GITHUB_RUN_ID + '/approvals';
    const qualified = {
      archive: 'be15221c6b6b9d171d210e7c0a4b12b149601484f305b198a23d6a820865db02',
      index: 'sha256:fe4721455807c1f1532c60b9457ecda962630fd54417002809fdd5db8553ae6e'
    };
    function approvalComment() {
      const decision = process.env.MODE === 'publish-first'
        ? 'I accept hidden-tag overwrite and external-writer risk for ghcr.io/thestateofwhere/zevyrn:1.2.1'
        : 'I approve publication only with proven tag absence for ghcr.io/thestateofwhere/zevyrn:1.2.1';
      return decision + '; run=' + process.env.GITHUB_RUN_ID + '; sha=' + process.env.GITHUB_SHA +
        '; asset=' + process.env.ASSET + '; archive=' + qualified.archive + '; index=' + qualified.index;
    }
    async function apiJSON(url, operation) {
      const response = await request(url, 'GET', 'Bearer ' + process.env.GH_TOKEN);
      observe(operation, response);
      if (response.status !== 200) stop('APPROVAL_PROTECTION_NOT_DEMONSTRATED');
      try { return JSON.parse(response.body.toString('utf8')); } catch { stop('INVALID_APPROVAL_EVIDENCE'); }
    }
    async function verifyProtection() {
      report.stage = 'environment-protection';
      const environment = await apiJSON(ENV_URL, 'environment-protection');
      const rules = Array.isArray(environment?.protection_rules) ? environment.protection_rules.filter(r => r.type === 'required_reviewers') : [];
      if (environment?.name !== ENVIRONMENT || !Number.isSafeInteger(environment.id) || environment.id <= 0 ||
          rules.length !== 1 || rules[0].reviewers?.length !== 1 ||
          rules[0].reviewers[0].type !== 'User' || rules[0].reviewers[0].reviewer?.login !== 'TheStateOfWhere' ||
          environment.deployment_branch_policy?.protected_branches !== false ||
          environment.deployment_branch_policy?.custom_branch_policies !== true) stop('APPROVAL_PROTECTION_NOT_DEMONSTRATED');
      const policies = await apiJSON(POLICIES_URL, 'environment-ref-policy');
      if (policies?.total_count !== 1 || policies.branch_policies?.length !== 1 ||
          policies.branch_policies[0].name !== 'v1.2.1' || policies.branch_policies[0].type !== 'tag') stop('APPROVAL_REF_POLICY_NOT_DEMONSTRATED');
      // The documented API does not promise the UI bypass flag. A real same-run owner
      // approval below is mandatory even if someone bypasses the native waiting gate.
      report.environmentProtection = { name: ENVIRONMENT, id: environment.id, ownerReviewer: 'TheStateOfWhere', bypassSetting: 'not-inferred-from-api', ref: 'refs/tags/v1.2.1' };
      if (process.env.MODE === 'publish-first' || process.env.MODE === 'publish') report.requiredOwnerComment = approvalComment();
      if (process.env.CHECK_STAGE === 'immediate') {
        report.stage = 'owner-approval';
        const reviews = await apiJSON(APPROVALS_URL, 'run-owner-approval');
        if (!Array.isArray(reviews)) stop('INVALID_APPROVAL_EVIDENCE');
        const relevant = reviews.filter(r => Array.isArray(r.environments) && r.environments.some(e => e.id === environment.id && e.name === ENVIRONMENT));
        if (relevant.length !== 1 || relevant[0].state !== 'approved' || relevant[0].user?.login !== 'TheStateOfWhere' ||
            relevant[0].comment !== approvalComment()) stop('EXPLICIT_OWNER_APPROVAL_NOT_DEMONSTRATED');
        report.ownerApproval = { runID: process.env.GITHUB_RUN_ID, reviewer: 'TheStateOfWhere', exactScopeComment: true };
      }
    }

    const ACCEPT = 'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json';
    const report = {
      target: 'ghcr.io/thestateofwhere/zevyrn:1.2.1',
      runID: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
      workflowSHA: process.env.GITHUB_SHA, workflowRef: process.env.GITHUB_WORKFLOW_REF,
      requestedJobPermission: 'packages:write; actions:read; contents:read', requestedRegistryScope: SCOPE,
      effectiveRegistryScope: 'not-established', publicationAuthority: 'not-tested',
      classification: 'BLOCKED', stage: 'guard', observations: []
    };
    function stop(reason) { throw Object.assign(new Error(reason), { diagnosticCode: reason }); }
    async function request(url, method, authorization) {
      // Fixed allowlist and methods: even a malicious challenge cannot redirect credentials.
      if (![TARGET, TOKEN_URL, ENV_URL, POLICIES_URL, APPROVALS_URL].includes(url) || !['HEAD', 'GET'].includes(method)) stop('REQUEST_NOT_ALLOWED');
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(url, {
          method, redirect: 'error', signal: controller.signal,
          headers: { Accept: url.startsWith(API) ? 'application/vnd.github+json' : url === TOKEN_URL ? 'application/json' : ACCEPT,
            ...(url.startsWith(API) ? { 'X-GitHub-Api-Version': '2022-11-28' } : {}),
            ...(authorization ? { Authorization: authorization } : {}) }
        });
        const chunks = []; let size = 0;
        for await (const chunk of response.body || []) {
          size += chunk.length;
          if (size > 262144) { controller.abort(); stop('RESPONSE_TOO_LARGE'); }
          chunks.push(chunk);
        }
        return { status: response.status, headers: response.headers, body: Buffer.concat(chunks) };
      } catch (error) {
        if (error.diagnosticCode) throw error;
        stop(controller.signal.aborted ? 'REQUEST_TIMEOUT' : 'NETWORK_OR_REDIRECT_FAILURE');
      } finally { clearTimeout(timer); }
    }
    function observe(operation, response) {
      const rawDigest = response.headers.get('docker-content-digest');
      const digest = /^sha256:[a-f0-9]{64}$/.test(rawDigest || '') ? rawDigest : null;
      const rawType = response.headers.get('content-type')?.split(';')[0].trim();
      const contentType = ACCEPT.split(', ').concat('application/json').includes(rawType) ? rawType : null;
      const version = response.headers.get('docker-distribution-api-version') === 'registry/2.0' ? 'registry/2.0' : null;
      const codes = [];
      // Never persist arbitrary response messages/details, headers or token response bodies.
      if (response.status >= 400 && operation !== 'token-exchange') {
        try {
          const parsed = JSON.parse(response.body.toString('utf8'));
          for (const error of Array.isArray(parsed.errors) ? parsed.errors : []) {
            if (['UNAUTHORIZED', 'DENIED', 'MANIFEST_UNKNOWN', 'NAME_UNKNOWN', 'TOOMANYREQUESTS', 'UNKNOWN', 'UNSUPPORTED'].includes(error.code)) codes.push(error.code);
          }
        } catch { /* Status is retained; invalid/non-JSON error body confers no authority. */ }
      }
      const observation = { operation, status: response.status, digest, contentType, apiVersion: version, registryErrorCodes: codes };
      report.observations.push(observation);
      return observation;
    }
    async function main() {
      try {
        if (process.env.GITHUB_REPOSITORY !== 'TheStateOfWhere/zevyrn-password-generator' ||
            process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || !['refs/heads/main', 'refs/tags/v1.2.1'].includes(process.env.GITHUB_REF) ||
            !process.env.GH_TOKEN || !/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,99})(?:\[bot\])?$/.test(process.env.GITHUB_ACTOR || '')) stop('INVALID_EXECUTION_CONTEXT');
        if (!['authorize', 'publish', 'publish-first'].includes(process.env.MODE) ||
            !['preflight', 'immediate'].includes(process.env.CHECK_STAGE) ||
            !/^[1-9][0-9]{0,19}$/.test(process.env.GITHUB_RUN_ID || '') || process.env.GITHUB_RUN_ATTEMPT !== '1' ||
            !/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '') ||
            ((process.env.MODE !== 'authorize') && (process.env.GITHUB_REF !== 'refs/tags/v1.2.1' || !/^[1-9][0-9]{0,19}$/.test(process.env.ASSET || ''))) ||
            (process.env.CHECK_STAGE === 'immediate' && process.env.MODE === 'authorize')) stop('INVALID_PUBLICATION_CONTEXT');
        report.checkStage = process.env.CHECK_STAGE;
        report.mode = process.env.MODE;
        await verifyProtection();
        report.stage = 'challenge';
        const challenge = await request(TARGET, 'HEAD');
        observe('unauthenticated-manifest-head', challenge);
        if (challenge.status === 200) {
          report.classification = 'TAG_EXISTS_ANONYMOUSLY';
          stop('EXISTING_TAG_REFUSED');
        }
        if (challenge.status !== 401) stop('UNEXPECTED_CHALLENGE_STATUS');
        // Accept only the documented GHCR target challenge; do not follow arbitrary realms.
        const header = challenge.headers.get('www-authenticate') || '';
        if (!/^Bearer\s+/i.test(header)) stop('INVALID_BEARER_CHALLENGE');
        const attrs = {}; let rest = header.replace(/^Bearer\s+/i, '');
        while (rest) {
          const match = /^([a-z]+)="([^"\r\n\\]*)"(?:\s*,\s*|$)/i.exec(rest);
          if (!match || Object.hasOwn(attrs, match[1].toLowerCase())) stop('INVALID_BEARER_CHALLENGE');
          attrs[match[1].toLowerCase()] = match[2]; rest = rest.slice(match[0].length);
        }
        if (Object.keys(attrs).some(key => !['realm', 'service', 'scope'].includes(key)) ||
            attrs.realm !== 'https://ghcr.io/token' || attrs.service !== 'ghcr.io' ||
            (attrs.scope !== undefined && attrs.scope !== SCOPE)) stop('UNEXPECTED_CHALLENGE_AUTHORITY');
        report.challenge = { scheme: 'Bearer', ...attrs };
        report.stage = 'token-exchange';
        const basic = Buffer.from(process.env.GITHUB_ACTOR + ':' + process.env.GH_TOKEN).toString('base64');
        const exchanged = await request(TOKEN_URL, 'GET', 'Basic ' + basic);
        observe('token-exchange', exchanged);
        report.tokenExchange = exchanged.status === 200 ? 'http-success-pending-token-validation' : 'failed';
        if (exchanged.status !== 200) stop(exchanged.status === 401 || exchanged.status === 403 ? 'TOKEN_AUTHENTICATION_OR_AUTHORIZATION_FAILED' : 'TOKEN_EXCHANGE_FAILED');
        let payload;
        try { payload = JSON.parse(exchanged.body.toString('utf8')); } catch { stop('INVALID_TOKEN_RESPONSE'); }
        const bearer = payload?.token || payload?.access_token;
        if (typeof bearer !== 'string' || !/^[A-Za-z0-9._~+\/-]+={0,2}$/.test(bearer) || bearer.length > 65536 ||
            (payload.token && payload.access_token && payload.token !== payload.access_token)) stop('INVALID_TOKEN_RESPONSE');
        // No token is printed, decoded, written to disk, or included in an exception.
        report.tokenExchange = 'succeeded-effective-scope-unproven';
        report.stage = 'authenticated-manifest-head';
        const head = await request(TARGET, 'HEAD', 'Bearer ' + bearer);
        observe('authenticated-manifest-head', head);
        if (![200, 404].includes(head.status)) stop(head.status === 401 || head.status === 403 ? 'MANIFEST_AUTHENTICATION_OR_AUTHORIZATION_FAILED' : 'UNEXPECTED_MANIFEST_HEAD_STATUS');
        report.stage = 'authenticated-manifest-get';
        const get = await request(TARGET, 'GET', 'Bearer ' + bearer);
        const observation = observe('authenticated-manifest-get', get);
        if (head.status !== get.status) stop('CONTRADICTORY_MANIFEST_RESPONSES');
        if (get.status === 404) {
          // Token issuance may grant an empty intersection. A 404 alone is not a grant.
          report.classification = 'NOT_FOUND_UNDER_TESTED_IDENTITY_SCOPE_UNPROVEN';
          report.sufficientFor = 'neither-confirmed-absence-nor-publication-eligibility';
          if (!observation.registryErrorCodes.includes('MANIFEST_UNKNOWN') || observation.registryErrorCodes.some(c => c !== 'MANIFEST_UNKNOWN')) stop('AMBIGUOUS_REGISTRY_ERROR');
          let errorBody;
          try { errorBody = JSON.parse(get.body.toString('utf8')); } catch { stop('MALFORMED_REGISTRY_ERROR'); }
          if (!Array.isArray(errorBody?.errors) || errorBody.errors.length === 0 ||
              !errorBody.errors.every(e => e && typeof e === 'object' && e.code === 'MANIFEST_UNKNOWN') ||
              head.headers.get('docker-content-digest') || get.headers.get('docker-content-digest')) stop('MALFORMED_OR_CONTRADICTORY_REGISTRY_ERROR');
          if (process.env.MODE !== 'publish-first') stop('AMBIGUOUS_NOT_FOUND');
          report.decision = process.env.CHECK_STAGE === 'immediate' ? 'ONE_ATTEMPT_AUTHORIZED_BY_OWNER_AT_KNOWN_AMBIGUOUS_404' : 'AWAITING_EXPLICIT_OWNER_RISK_APPROVAL';
          // The classification remains ambiguous: this is never a no-overwrite or absence proof.
          return;
        }
        let manifest;
        try { manifest = JSON.parse(get.body.toString('utf8')); } catch { stop('INVALID_MANIFEST_RESPONSE'); }
        if (manifest?.schemaVersion !== 2 || !ACCEPT.split(', ').includes(manifest.mediaType) ||
            !observation.digest || observation.digest !== 'sha256:' + crypto.createHash('sha256').update(get.body).digest('hex') ||
            observation.contentType !== manifest.mediaType) stop('INVALID_MANIFEST_RESPONSE');
        const headDigest = head.headers.get('docker-content-digest');
        if (headDigest && headDigest !== observation.digest) stop('CONTRADICTORY_MANIFEST_DIGESTS');
        report.classification = 'TAG_EXISTS_UNDER_TESTED_IDENTITY';
        report.effectiveRegistryScope = 'target-manifest-read-observed-only';
        report.sufficientFor = 'tag-existence-only-not-publication-authority';
        stop('EXISTING_TAG_REFUSED');
      } catch (error) {
        report.failure = error.diagnosticCode || 'INTERNAL_DIAGNOSTIC_FAILURE';
        process.exitCode = 1;
      } finally {
        // A diagnostic write failure also fails the job; raw exception data is never logged.
        try {
          fs.mkdirSync('publication-evidence', { recursive: true });
          fs.writeFileSync('publication-evidence/registry-' + process.env.CHECK_STAGE + '.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify(report, null, 2) + '\n```\n');
        } catch { process.exitCode = 1; console.error('DIAGNOSTIC_EVIDENCE_WRITE_FAILED'); }
      }
    }
    main();
  REPOSITORY: TheStateOfWhere/zevyrn-password-generator
  IMAGE: ghcr.io/thestateofwhere/zevyrn
  INDEX: sha256:fe4721455807c1f1532c60b9457ecda962630fd54417002809fdd5db8553ae6e
  PLATFORM: sha256:75d744f9c4c10eeede58304cddff54530c08c9efccd0097ec24e5f074d7fa2f0
  CONFIG: sha256:9b0d4db6534dbc82f96c0de4d71f318257716b936e17867f8595dd8fcc4e9dc8
  ARCHIVE_SHA256: be15221c6b6b9d171d210e7c0a4b12b149601484f305b198a23d6a820865db02
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject wrong repository, release ref or dispatch mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ASSET: ${{ inputs.draft_asset_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TheStateOfWhere/zevyrn-password-generator'
          if [[ "$MODE" == publish || "$MODE" == publish-first || "$MODE" == verify-public ]]; then
            test "$GITHUB_REF" = 'refs/tags/v1.2.1'
          else
            [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v1.2.1 ]]
          fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODE" == inspect || "$MODE" == authorize || "$MODE" == publish || "$MODE" == publish-first || "$MODE" == verify-public ]]
          if [[ "$MODE" == inspect || "$MODE" == publish || "$MODE" == publish-first ]]; then [[ "$ASSET" =~ ^[1-9][0-9]{0,19}$ ]]; fi
  inspect:
    if: inputs.mode == 'inspect' || inputs.mode == 'publish' || inputs.mode == 'publish-first'
    runs-on: ubuntu-24.04
    needs: guard
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      asset: ${{ steps.download.outputs.asset }}
    steps:
      - name: Authenticate draft asset and exact retained OCI archive
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ inputs.draft_asset_id }}
        run: |
          set -euo pipefail
          [[ "$ASSET" =~ ^[1-9][0-9]{0,19}$ ]]
          mkdir publication-evidence
          # Authenticated listing includes visible drafts; every page is required.
          gh api "repos/$REPOSITORY/releases?per_page=100" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --paginate --slurp > "$RUNNER_TEMP/releases.json"
          node -e "$DRAFT_LOOKUP_JS"
          jq '{id,draft,tag_name,target_commitish}' "$RUNNER_TEMP/draft.json" > publication-evidence/draft.json
          jq -e --arg sha "$GITHUB_SHA" '.draft == true and .tag_name == "v1.2.1" and .target_commitish == $sha' publication-evidence/draft.json
          gh api "repos/$REPOSITORY/releases/$(jq -r .id publication-evidence/draft.json)/assets" --paginate --slurp > "$RUNNER_TEMP/assets.json"
          jq --argjson id "$ASSET" '[.[][] | select(.id == $id) | {id,name,state,size}]' "$RUNNER_TEMP/assets.json" > publication-evidence/assets.json
          jq -e --argjson id "$ASSET" '[.[] | select(.id == $id and .name == "qualified-runtime-v1.2.1.oci.tar" and .state == "uploaded" and .size == 26021376)] | length == 1' publication-evidence/assets.json
          gh api "repos/$REPOSITORY/releases/assets/$ASSET" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/runtime.tar"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/runtime.tar" | sha256sum --check --strict
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          expected={
            'fe4721455807c1f1532c60b9457ecda962630fd54417002809fdd5db8553ae6e',
            '75d744f9c4c10eeede58304cddff54530c08c9efccd0097ec24e5f074d7fa2f0',
            '9b0d4db6534dbc82f96c0de4d71f318257716b936e17867f8595dd8fcc4e9dc8',
            '29ac8db0bd7aaa9fc7f42286275adca7f48e84fe41ba60f1f084f02428d89b84',
            '3fe0a757ca1a92de24d2351c588e603520456e237755e976f0eb3a879530b83c',
            '44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a',
            'dffeab4431af0afa5e2dd1d461c8efee89df74a3335ba030a764889d5e06667d'}
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'runtime.tar') as t:
            rows={}
            for h in expected:
              p='blobs/sha256/'+h
              matches=[m for m in t.getmembers() if m.name==p]
              if len(matches)!=1 or not matches[0].isfile():raise ValueError('Archive member identity')
              b=t.extractfile(matches[0]).read()
              if hashlib.sha256(b).hexdigest()!=h:raise ValueError('Archive blob hash')
              rows[h]=len(b)
            config=json.load(t.extractfile('blobs/sha256/'+os.environ['CONFIG'][7:]))
            if (config['os'],config['architecture'],config['config']['User'])!=('linux','amd64','10001:10001'):raise ValueError('Runtime platform/user')
            if config['rootfs']['diff_ids']!=['sha256:d4e43179edd35bbb1e6b56b7c1028beb8c75bd11042819be97a6a43989f747d1']:raise ValueError('Runtime filesystem')
          pathlib.Path('publication-evidence/archive-verification.json').write_text(json.dumps({'archiveSHA256':os.environ['ARCHIVE_SHA256'],'index':os.environ['INDEX'],'platform':os.environ['PLATFORM'],'config':os.environ['CONFIG'],'sourceManifest':'3fe846fe9808eebec37bfa79bec2a66b235a54552049a760b548bd805a929dec','blobs':rows,'releaseCommit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed v7.0.2
        if: always()
        with:
          name: qualified-archive-inspection
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 14
  authorize:
    if: inputs.mode == 'authorize' || inputs.mode == 'publish' || inputs.mode == 'publish-first'
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Verify owner protection and collect fixed-target registry preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ASSET: ${{ inputs.draft_asset_id }}
        run: |
          set -euo pipefail
          CHECK_STAGE=preflight node -e "$REGISTRY_CHECK_JS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed v7.0.2
        if: always()
        with:
          name: qualified-image-package-authorization
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.repository == 'TheStateOfWhere/zevyrn-password-generator' && github.ref == 'refs/tags/v1.2.1' && (inputs.mode == 'publish' || inputs.mode == 'publish-first')
    needs: [guard, inspect, authorize]
    environment: zevyrn-ghcr-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Install supported daemonless registry transfer tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          mkdir publication-evidence
          skopeo --version > publication-evidence/skopeo-version.txt
          dpkg-query -W skopeo > publication-evidence/skopeo-package.txt
          sha256sum "$(command -v skopeo)" > publication-evidence/skopeo-binary-sha256.txt
      - name: Verify package authority, reject existing version, copy exact OCI graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.inspect.outputs.asset }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          auth="$RUNNER_TEMP/zevyrn-ghcr-auth.json"
          trap 'rm -f -- "$auth"' EXIT
          # The inspected asset ID is fixed; every downloaded byte is reauthenticated.
          [[ "$ASSET" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$REPOSITORY/releases/assets/$ASSET" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/runtime.tar"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/runtime.tar" | sha256sum --check --strict
          skopeo inspect --raw "oci-archive:$RUNNER_TEMP/runtime.tar" > publication-evidence/source-index.json
          printf '%s  %s\n' "${INDEX#sha256:}" publication-evidence/source-index.json | sha256sum --check --strict
          # Prove this installed tool can preserve the whole graph locally BEFORE login/push.
          skopeo copy --all --preserve-digests --digestfile publication-evidence/local-copy-digest.txt "oci-archive:$RUNNER_TEMP/runtime.tar" "oci:$RUNNER_TEMP/validated-graph:qualified"
          test "$(cat publication-evidence/local-copy-digest.txt)" = "$INDEX"
          tar -tf "$RUNNER_TEMP/runtime.tar" | grep -E '^blobs/sha256/[a-f0-9]{64}$' > "$RUNNER_TEMP/blob-paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/blob-paths.txt")" -eq 7
          while IFS= read -r path; do
            printf '%s  %s\n' "${path##*/}" "$RUNNER_TEMP/validated-graph/$path" | sha256sum --check --strict
          done < "$RUNNER_TEMP/blob-paths.txt"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          # Native protection and exact owner approval are reauthenticated in this job.
          # A known ambiguous404 needs publish-first and the owner's exact risk comment.
          CHECK_STAGE=immediate node -e "$REGISTRY_CHECK_JS"
          # Last read is still not atomic with the write. External writers remain a risk.
          skopeo copy --all --preserve-digests --authfile "$auth" --digestfile publication-evidence/copied-index-digest.txt "oci-archive:$RUNNER_TEMP/runtime.tar" "docker://$IMAGE:1.2.1"
          test "$(cat publication-evidence/copied-index-digest.txt)" = "$INDEX"
          skopeo inspect --authfile "$auth" --raw "docker://$IMAGE:1.2.1" > publication-evidence/published-tag-index.json
          printf '%s  %s\n' "${INDEX#sha256:}" publication-evidence/published-tag-index.json | sha256sum --check --strict
          for digest in "$INDEX" "$PLATFORM"; do
            name="${digest#sha256:}.json"
            skopeo inspect --authfile "$auth" --raw "docker://$IMAGE@$digest" > "publication-evidence/$name"
            printf '%s  %s\n' "${digest#sha256:}" "publication-evidence/$name" | sha256sum --check --strict
          done
          skopeo inspect --authfile "$auth" --raw --config "docker://$IMAGE@$PLATFORM" > publication-evidence/runtime-config.json
          printf '%s  %s\n' "${CONFIG#sha256:}" publication-evidence/runtime-config.json | sha256sum --check --strict
          printf 'Exact qualified image pushed: `%s@%s`. Public visibility and anonymous full-graph verification remain REQUIRED; this is not release/deployment acceptance.\n' "$IMAGE" "$INDEX" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed v7.0.2
        if: always()
        with:
          name: qualified-image-transfer
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 14
  verify-public:
    if: github.repository == 'TheStateOfWhere/zevyrn-password-generator' && github.ref == 'refs/tags/v1.2.1' && inputs.mode == 'verify-public'
    runs-on: ubuntu-24.04
    needs: guard
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Anonymous immutable-index pull and full graph verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          mkdir publication-evidence
          skopeo --version > publication-evidence/skopeo-version.txt
          # --no-creds / --src-no-creds prohibit use of any runner registry login.
          skopeo inspect --no-creds --raw "docker://$IMAGE:1.2.1" > publication-evidence/public-tag-index.json
          printf '%s  %s\n' "${INDEX#sha256:}" publication-evidence/public-tag-index.json | sha256sum --check --strict
          skopeo copy --all --preserve-digests --src-no-creds --digestfile publication-evidence/anonymous-index-digest.txt "docker://$IMAGE@$INDEX" "oci:$RUNNER_TEMP/anonymous-zevyrn:qualified"
          test "$(cat publication-evidence/anonymous-index-digest.txt)" = "$INDEX"
          # Authenticate all fetched manifests, config, attestations and layer blobs.
          for hash in fe4721455807c1f1532c60b9457ecda962630fd54417002809fdd5db8553ae6e 75d744f9c4c10eeede58304cddff54530c08c9efccd0097ec24e5f074d7fa2f0 9b0d4db6534dbc82f96c0de4d71f318257716b936e17867f8595dd8fcc4e9dc8 29ac8db0bd7aaa9fc7f42286275adca7f48e84fe41ba60f1f084f02428d89b84 3fe0a757ca1a92de24d2351c588e603520456e237755e976f0eb3a879530b83c 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a dffeab4431af0afa5e2dd1d461c8efee89df74a3335ba030a764889d5e06667d; do
            printf '%s  %s\n' "$hash" "$RUNNER_TEMP/anonymous-zevyrn/blobs/sha256/$hash" | sha256sum --check --strict
          done
          cp "$RUNNER_TEMP/anonymous-zevyrn/blobs/sha256/${CONFIG#sha256:}" publication-evidence/runtime-config.json
          jq -e '.os == "linux" and .architecture == "amd64" and .config.User == "10001:10001" and .config.ExposedPorts == {"8080/tcp":{}} and .config.Entrypoint == ["nginx"] and .rootfs.diff_ids == ["sha256:d4e43179edd35bbb1e6b56b7c1028beb8c75bd11042819be97a6a43989f747d1"]' publication-evidence/runtime-config.json
          printf 'Anonymous exact-image verification PASS: `%s@%s`, platform `%s`, config `%s`. No container was started or deployed.\n' "$IMAGE" "$INDEX" "$PLATFORM" "$CONFIG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed v7.0.2
        if: always()
        with:
          name: qualified-image-anonymous-verification
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 14
