name: Qualify Zevyrn v1.2.2 artifact
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact approved main commit containing v1.2.2 metadata
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  QUALIFICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  QUALIFICATION_KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
  QUALIFICATION_PREFIX: ${{ github.event_name == 'pull_request' && 'zevyrn-v1.2.2-pr' || 'zevyrn-v1.2.2' }}
concurrency:
  group: zevyrn-v1.2.2-qualification-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      started_at: ${{ steps.init.outputs.started_at }}
    env:
      TRIVY_DISABLE_TELEMETRY: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify actual PR head or exact main release source
        id: init
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-integrity.mjs qualification-context
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE"
          test "$(node -p "require('./package.json').version")" = 1.2.2
          printf 'started_at=%s\n' "$(date --utc --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
      - name: Require matching successful source CI without a parallel-run race
        shell: bash
        env:
          QUALITY_EVENT: ${{ steps.init.outputs.quality_event }}
          QUALITY_BRANCH: ${{ steps.init.outputs.quality_branch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release/packet
          for attempt in $(seq 1 30); do
            quality_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality-security.yml --commit "$QUALIFICATION_SOURCE" --event "$QUALITY_EVENT" --branch "$QUALITY_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ "$quality_run" =~ ^[1-9][0-9]*$ ]]; then break; fi
            sleep 10
          done
          [[ "$quality_run" =~ ^[1-9][0-9]*$ ]]
          timeout 10m gh run watch "$quality_run" --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$quality_run" > artifacts/release/packet/quality-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$quality_run/jobs?filter=latest&per_page=100" > artifacts/release/packet/quality-jobs.json
          node scripts/release-integrity.mjs quality artifacts/release/packet/quality-run.json artifacts/release/packet/quality-jobs.json
      - name: Existing build, application, configuration, integrity and audit gates
        shell: bash
        run: |
          set -euo pipefail
          compose_bin="$RUNNER_TEMP/docker-compose-v5.6.0"
          curl --fail --location https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 --output "$compose_bin"
          printf '%s  %s\n' 40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a "$compose_bin" | sha256sum --check --strict
          chmod 0755 "$compose_bin"
          test "$("$compose_bin" version --short)" = 5.6.0
          export ZEVYRN_COMPOSE_BIN="$compose_bin"
          npm ci --no-audit --no-fund
          node --test tests/source-build-portability.mjs
          npm test
          npx --no-install tsc6 --noEmit
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          mkdir -p artifacts/release/packet
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-raw.json"
          audit_status=$?
          set -e
          test "$audit_status" -le 1
          node scripts/ci-security.mjs npm "$RUNNER_TEMP/npm-raw.json" artifacts/release/packet/npm-audit.json
      - name: Build builder and one retained Linux/amd64 OCI archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          docker build --platform linux/amd64 --target build -t zevyrn-release-builder .
          docker save -o "$RUNNER_TEMP/builder.tar" zevyrn-release-builder
          docker buildx create --name "zevyrn-release-$GITHUB_RUN_ID" --driver docker-container --use
          mkdir -p artifacts/release/diagnostics
          docker buildx version > "$RUNNER_TEMP/release-buildx.txt"
          docker buildx inspect --bootstrap > "$RUNNER_TEMP/release-buildkit.txt"
          docker inspect --format '{{.Image}}' "buildx_buildkit_zevyrn-release-${GITHUB_RUN_ID}0" > "$RUNNER_TEMP/release-buildkit-image.txt"
          docker buildx build --platform linux/amd64 --provenance=mode=min --label "org.opencontainers.image.revision=$QUALIFICATION_SOURCE" --label org.opencontainers.image.source=https://github.com/TheStateOfWhere/zevyrn-password-generator --tag ghcr.io/thestateofwhere/zevyrn:1.2.2 --output type=oci,dest=artifacts/release/packet/archive.oci.tar --metadata-file artifacts/release/packet/build-metadata.json .
          node scripts/release-integrity.mjs inspect artifacts/release/packet/archive.oci.tar artifacts/release/packet/identity.json artifacts/release/diagnostics/inspection.json
          skopeo inspect --raw oci-archive:artifacts/release/packet/archive.oci.tar > "$RUNNER_TEMP/index.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/index.json" | cut -d ' ' -f 1)" = "$(jq -r .indexDigest artifacts/release/packet/identity.json)"
          skopeo copy --override-os linux --override-arch amd64 oci-archive:artifacts/release/packet/archive.oci.tar docker-daemon:zevyrn-release-runtime:1.2.2
          docker image inspect zevyrn-release-runtime:1.2.2 > "$RUNNER_TEMP/loaded.json"
          node scripts/release-integrity.mjs loaded artifacts/release/packet/identity.json "$RUNNER_TEMP/loaded.json"
          docker create --name zevyrn-release-assets zevyrn-release-runtime:1.2.2
          mkdir artifacts/release/packet/assets
          docker cp zevyrn-release-assets:/usr/share/nginx/html/. artifacts/release/packet/assets/
          diff --recursive --brief dist artifacts/release/packet/assets
          node scripts/release-integrity.mjs assets artifacts/release/packet
      - name: Collect sanitized failed-archive diagnostics
        if: ${{ failure() && steps.archive.conclusion == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release/diagnostics
          node scripts/release-integrity.mjs diagnostics artifacts/release/packet/archive.oci.tar artifacts/release/packet/build-metadata.json artifacts/release/diagnostics/archive.json
      - name: Retain non-promotable failure diagnostics only
        if: ${{ failure() && steps.archive.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zevyrn-v1.2.2-failed-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/diagnostics/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Fresh builder and exact archive security scans and SBOM
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7 "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          export TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache"
          "$RUNNER_TEMP/trivy" image --download-db-only
          "$RUNNER_TEMP/trivy" version --format json > artifacts/release/packet/scanner-version.json
          "$RUNNER_TEMP/trivy" image --input artifacts/release/packet/archive.oci.tar --scanners vuln,secret --image-config-scanners secret --format json --output "$RUNNER_TEMP/runtime-raw.json"
          "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/builder.tar" --scanners vuln,secret --image-config-scanners secret --format json --output "$RUNNER_TEMP/builder-raw.json"
          node scripts/ci-security.mjs trivy "$RUNNER_TEMP/runtime-raw.json" artifacts/release/packet/runtime-scan.json "$RUNNER_TEMP/builder-raw.json" artifacts/release/packet/builder-scan.json
          sha256sum "$RUNNER_TEMP/builder.tar" | cut -d ' ' -f 1 > "$RUNNER_TEMP/builder.sha256"
          node --input-type=module -e 'import {readFile,writeFile} from "node:fs/promises";const p="artifacts/release/packet/",i=JSON.parse(await readFile(p+"identity.json")),b=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/builder-raw.json"));await writeFile(p+"builder-identity.json",JSON.stringify({sourceCommit:i.sourceCommit,sourceTree:i.sourceTree,imageID:b.Metadata.ImageID,archiveSHA256:(await readFile(process.env.RUNNER_TEMP+"/builder.sha256","utf8")).trim()},null,2)+"\n");'
          "$RUNNER_TEMP/trivy" image --input artifacts/release/packet/archive.oci.tar --format cyclonedx --output artifacts/release/packet/runtime-sbom.cdx.json
      - name: Hardened execution of the image derived from the archive
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name zevyrn-release-health --network none --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 128m --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 zevyrn-release-runtime:1.2.2
          docker inspect zevyrn-release-health > "$RUNNER_TEMP/container.json"
          node scripts/release-integrity.mjs container "$RUNNER_TEMP/container.json"
          for attempt in $(seq 1 30); do
            if docker exec zevyrn-release-health wget -qO /dev/null http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          test "$(docker exec zevyrn-release-health wget -qO- http://127.0.0.1:8080/healthz)" = ok
          docker exec zevyrn-release-health nginx -t
          docker exec zevyrn-release-health sh -ec 'test "$(id -u)" = 10001; ! command -v node; ! command -v npm; ! test -d /app/node_modules'
          for spec in libexpat=2.10.0-r0 zlib=1.4-r0 libx11=1.8.14-r0 brotli-libs=1.2.1-r0 curl=8.23.0-r0 libcurl=8.23.0-r0 libxslt=1.1.43-r4 musl-utils=1.2.6-r3; do
            installed="$(jq -r --arg name "${spec%%=*}" '[.components[] | select(.name == $name) | .version] | if length == 1 then .[0] else error("Missing or duplicate runtime package") end' artifacts/release/packet/runtime-sbom.cdx.json)"
            test -n "$installed"
            test "$(docker exec zevyrn-release-health apk version -t "$installed" "${spec#*=}")" != '<'
          done
          docker exec zevyrn-release-health wget -S -O /dev/null http://127.0.0.1:8080/healthz > "$RUNNER_TEMP/headers.txt" 2>&1
          for header in "Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" 'X-Content-Type-Options: nosniff' 'Referrer-Policy: no-referrer' 'X-Frame-Options: DENY' 'Permissions-Policy: camera=(), microphone=(), geolocation=()' 'Cache-Control: no-store'; do grep -F "$header" "$RUNNER_TEMP/headers.txt"; done
          docker stop --signal SIGQUIT --time 10 zevyrn-release-health
          test "$(docker inspect --format '{{.State.ExitCode}} {{.State.OOMKilled}}' zevyrn-release-health)" = '0 false'
          node --input-type=module -e 'import {readFile,writeFile} from "node:fs/promises"; const p="artifacts/release/packet/";const i=JSON.parse(await readFile(p+"identity.json"));await writeFile(p+"health.json",JSON.stringify({archiveSHA256:i.archiveSHA256,indexDigest:i.indexDigest,passed:true,checks:["image-config-and-rootfs","container-hardening","health","nginx-config","headers","assets","no-build-tools","graceful-stop"]},null,2)+"\n");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.QUALIFICATION_PREFIX }}-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/packet/
          if-no-files-found: error
          retention-days: 14
  browser:
    needs: runtime
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QUALIFICATION_STARTED_AT: ${{ needs.runtime.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.QUALIFICATION_PREFIX }}-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: packet
      - name: Verify archive and run all eight suites on its byte-identical assets
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-compiler.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath packet/assets -Destination dist -Recurse
          $env:KEYSMITH_BROWSER_PATH = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $env:KEYSMITH_PLAYWRIGHT_MODULE = Join-Path $PWD 'node_modules/playwright'
          if (!(Test-Path -LiteralPath $env:KEYSMITH_BROWSER_PATH)) { throw 'Edge unavailable' }
          node scripts/release-integrity.mjs browser packet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.QUALIFICATION_PREFIX }}-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: packet/browser-results.json
          if-no-files-found: error
          retention-days: 14
  seal:
    needs: [runtime, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUNTIME_RESULT: ${{ needs.runtime.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      QUALIFICATION_STARTED_AT: ${{ needs.runtime.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.QUALIFICATION_PREFIX }}-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: packet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.QUALIFICATION_PREFIX }}-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: packet
      - name: Seal source, archive, assets and successful qualification evidence
        run: node scripts/release-integrity.mjs seal packet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.QUALIFICATION_PREFIX }}-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: packet/
          if-no-files-found: error
          retention-days: 14
