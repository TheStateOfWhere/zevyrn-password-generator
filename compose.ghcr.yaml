# Prebuilt release image: use alone after verified GHCR publication.
name: zevyrn
services:
  zevyrn:
    platform: linux/amd64
    image: "${ZEVYRN_IMAGE:-ghcr.io/thestateofwhere/zevyrn:1.2.1}"
    pull_policy: missing
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128
    ports:
      - "127.0.0.1:${ZEVYRN_PORT:-18080}:8080"
    networks: [app]
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
networks:
  app: {}
